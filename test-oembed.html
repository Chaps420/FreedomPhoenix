<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test YouTube oEmbed</title>
    <link rel="icon" href="phoenix-new.jpg" type="image/jpeg">
</head>
<body>
    <h1>Test YouTube oEmbed API</h1>
    <button onclick="testOEmbed()">Test oEmbed for RvWbcK3YQ_o</button>
    <div id="result"></div>

    <script>
        async function testOEmbed() {
            const videoId = 'RvWbcK3YQ_o';
            const videoUrl = `https://www.youtube.com/watch?v=${videoId}`;
            const oEmbedUrl = `https://www.youtube.com/oembed?url=${encodeURIComponent(videoUrl)}&format=json`;
            
            console.log('Testing oEmbed for:', videoUrl);
            console.log('oEmbed URL:', oEmbedUrl);
            
            try {
                const response = await fetch(oEmbedUrl);
                console.log('Response status:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('oEmbed data:', data);
                    document.getElementById('result').innerHTML = `
                        <h3>Success!</h3>
                        <p><strong>Title:</strong> ${data.title}</p>
                        <p><strong>Author:</strong> ${data.author_name}</p>
                        <p><strong>Thumbnail:</strong> ${data.thumbnail_url}</p>
                    `;
                } else {
                    console.error('oEmbed failed:', response.status, response.statusText);
                    document.getElementById('result').innerHTML = `<p style="color: red;">Failed: ${response.status} ${response.statusText}</p>`;
                }
            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('result').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
